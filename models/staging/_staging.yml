version: 2

models:
  - name: stg_products
    description: "Produits nettoyés et typés."
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: category
        data_tests:
          - accepted_values:
              arguments:
                values: ["Câbles", "Éclairage", "Outillage", "Protection", "Connectique"]
      - name: unit_cost
        data_tests: [not_null]

  - name: stg_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]

  - name: stg_price_history
    description: "Prix catalogue avec leur période de validité (valid_from inclus, valid_to exclu)."
    columns:
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: list_price
        data_tests: [not_null]

  - name: stg_sales
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
