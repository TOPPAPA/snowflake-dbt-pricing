name: pricing_analytics
version: "1.0.0"
config-version: 2

profile: pricing_analytics

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]

clean-targets: ["target", "dbt_packages"]

seeds:
  pricing_analytics:
    +schema: raw
    raw_sales:
      +column_types:
        order_date: date
    raw_price_history:
      +column_types:
        valid_from: date

models:
  pricing_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
